name: Atualizar dados do painel
on:
  schedule:
    - cron: '17 6 * * *'   # todo dia às 02:17 de Manaus (06:17 UTC)
  workflow_dispatch: {}     # botão "Run workflow" para rodar na hora
permissions:
  contents: write
jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install pandas playwright
      - name: Instalar navegador para o download da SEFAZ (Dados Abertos)
        run: python -m playwright install --with-deps chromium
      - name: Coletar dados
        env:
          FALABR_CLIENT_ID: ${{ secrets.FALABR_CLIENT_ID }}
          FALABR_CLIENT_SECRET: ${{ secrets.FALABR_CLIENT_SECRET }}
          FALABR_USUARIO: ${{ secrets.FALABR_USUARIO }}
          FALABR_SENHA: ${{ secrets.FALABR_SENHA }}
          OUVIDORIA_URLS: ${{ vars.OUVIDORIA_URLS }}
        timeout-minutes: 50
        run: cd scripts && python -u atualizar.py
      - name: Publicar se houver mudança
        if: always()   # publica o que foi coletado mesmo se a coleta for interrompida
        run: |
          git config user.name  "robo-painel"
          git config user.email "robo-painel@users.noreply.github.com"
          git add data/ api/
          git diff --cached --quiet || git commit -m "Atualização automática dos dados ($(date +%F))"
          git push
